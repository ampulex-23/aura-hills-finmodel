# nginx site: shared.metodoxia25.net → AURA HILLS finmodel
# Ставится в /etc/nginx/sites-enabled/aura (секции для shared.metodoxia25.net
# из старого конфига game при этом удаляются/заменяются этим файлом).
server {
    server_name shared.metodoxia25.net;

    root /srv/aura-hills/web/dist;
    index index.html;

    # SPA: статика + fallback на index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # AI-прокси (ключ Polza живёт только на сервере)
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE-стриминг ответов LLM
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Хэшированные vite-ассеты — вечный кэш
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/shared.metodoxia25.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/shared.metodoxia25.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = shared.metodoxia25.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name shared.metodoxia25.net;
    return 404; # managed by Certbot
}
